name: 생산일보 자동 마감

# 업무 종료 10분 뒤 자동 마감 (평일 19:10 / 수·토·일·빨간날 17:10, 연장이면 최종 가동 10분 뒤)
# 다음날 07:00 전날 재마감 (늦게 들어온 작업자 마감 반영)
# 시각(UTC): 16:50~23:50 KST = 07:50~14:50 UTC 10분 간격 / 07:00 KST = 22:00 UTC
on:
  schedule:
    - cron: "50 7 * * *"
    - cron: "*/10 8-14 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / evening / morning"
        default: "auto"
      date:
        description: "YYYY-MM-DD (비우면 자동)"
        default: ""
      dry:
        description: "true = 저장하지 않고 확인만"
        default: "false"
      force:
        description: "true = 시각·중복 판단 무시"
        default: "false"

concurrency:
  group: auto-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock jsdom@24
      - name: 자동 마감
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          # 07:00 예약 실행은 GitHub 지연이 있어도 morning 으로 고정
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then MODE=morning; fi
          ARGS="$MODE ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          node scripts/auto_close.mjs $ARGS
